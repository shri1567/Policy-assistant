[project]
name = "policy-qa-assistant"
version = "0.1.0"
description = "RAG-based policy Q&A assistant with evidence, citations, and refusal logic"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.0",
    "google-genai>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
